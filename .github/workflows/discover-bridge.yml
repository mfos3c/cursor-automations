# When BB-Discover cloud agent pushes a branch, copy daily-pick → main automatically.
name: Discover bridge

on:
  push:
    branches:
      - "cursor/**discovery**"
      - "cursor/bug-bounty-program-discovery-*"

permissions:
  contents: write

jobs:
  merge-daily-pick:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge 20-bounties daily picks into main
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          picks=$(git ls-tree -r --name-only "$SOURCE_SHA" 20-bounties/ \
            | grep -E 'daily-pick-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)

          if [[ -z "$picks" ]]; then
            echo "No daily-pick files on $SOURCE_BRANCH ($SOURCE_SHA)"
            exit 0
          fi

          git fetch origin main
          git checkout -B main origin/main
          git checkout "$SOURCE_SHA" -- 20-bounties/

          if git diff --cached --quiet; then
            echo "main already up to date with picks from $SOURCE_BRANCH"
            exit 0
          fi

          git commit -m "chore: bridge daily pick from $SOURCE_BRANCH [discover-bridge]"
          git push origin main
