# When BB-Scan cloud agent pushes findings branch, copy scan notes → main.
name: Scan bridge

on:
  push:
    branches:
      - "cursor/bb-scan-daily-findings-*"

permissions:
  contents: write

jobs:
  merge-findings:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge 30-findings scan notes into main
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          scans=$(git ls-tree -r --name-only "$SOURCE_SHA" 30-findings/ \
            | grep -E 'scan-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)

          if [[ -z "$scans" ]]; then
            echo "No scan files on $SOURCE_BRANCH"
            exit 0
          fi

          git fetch origin main
          git checkout -B main origin/main
          git checkout "$SOURCE_SHA" -- 30-findings/

          if git diff --cached --quiet; then
            echo "main already up to date"
            exit 0
          fi

          git commit -m "chore: bridge scan findings from $SOURCE_BRANCH [scan-bridge]"
          git push origin main
