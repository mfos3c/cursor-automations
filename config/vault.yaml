# Obsidian Web3-Security vault is the canonical memory layer for the whole system.
# Git repo (cursor-automations) is a transport/backup bridge for cloud agents only.

vault_path: "/Users/mfosec/Documents/Obsidian Vaults/Web3-Security"
vault_name: "Web3-Security"

# Canonical paths (Obsidian vault layout — same folders mirrored in repo for cloud)
paths:
  daily_picks: "20-bounties"
  findings: "30-findings"
  reference: "50-reference"
  snapshots: "data"  # JSON cache; repo-only, not mirrored to vault

# Cloud BB-Discover cannot call Obsidian MCP → writes repo → inbound sync to vault
inbound_sync: "scripts/sync-to-obsidian.sh"   # git/repo → vault
outbound_sync: "scripts/sync-from-obsidian.sh" # vault → repo (after local MCP writes)

# Morning routine before BB-Scan (09:25 TR): merge cloud PR, then inbound sync
pull_and_sync: "scripts/pull-and-sync.sh"
